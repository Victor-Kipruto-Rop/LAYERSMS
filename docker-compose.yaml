services:
  layersms-db:
    container_name: layersms-db
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-adminUser}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:-adminPassword}
      - MONGO_INITDB_DATABASE=layersms
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    networks:
      - layersms-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional local administration UI. It is bound to loopback, not public interfaces.
  mongo-express:
    container_name: layersms-mongo-express
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER:-adminUser}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASS:-adminPassword}
      - ME_CONFIG_MONGODB_SERVER=layersms-db
    depends_on:
      layersms-db:
        condition: service_healthy
    networks:
      - layersms-network

  layersms-api:
    container_name: layersms-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - ./api/.env
    environment:
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://layersms-redis:6379}
    depends_on:
      layersms-db:
        condition: service_healthy
      layersms-redis:
        condition: service_healthy
    networks:
      - layersms-network

  layersms-web:
    container_name: layersms-web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ./web/.env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
      - API_INTERNAL_URL=http://layersms-api:3001/api/v1
    depends_on:
      layersms-api:
        condition: service_started
    networks:
      - layersms-network

  layersms-redis:
    container_name: layersms-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - layersms-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  layersms-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
